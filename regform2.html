<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />	
	<meta name="description" content="Web development" />
	<meta name="keywords" content="Registration Form" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />

	<!-- Load the styles and jQuery before the validation script. -->
	<link href="regform2_desktop.css" rel="stylesheet" type="text/css"
		media="screen and (min-device-width:481px)" />
	<link href="modal.css" rel="stylesheet" type="text/css" />
	<script src="jquery.min.js"></script>
	<script src="validation.js"></script>

	<title>Web Development Registration Form</title>
</head>
<body>
	<form id="regform" method="post"
		action="http://mercury.swin.edu.au/it000000/formtest.php">

		<h1>Registration Form</h1>
		<div>
			<a class="collapse" href="#accountInfo" role="button"
				aria-controls="accountInfo" aria-expanded="true"
				aria-label="Collapse Account Information">[-]</a>
			<span>Section A</span>
		</div>
		<fieldset id="accountInfo">
			<legend>Account Information</legend>

			<div class="textinput">
				<label for="sid">User ID</label>
				<input id="sid" type="text" name="id" />
			</div>

			<div class="textinput">
				<label for="pwd1">Password</label>
				<input id="pwd1" type="password" name="pwd1" />
			</div>

			<div class="textinput">
				<label for="pwd2">Retype Password</label>
				<input id="pwd2" type="password" name="pwd2" />
			</div>
		</fieldset>

		<div>
			<a class="collapse" href="#userInfo" role="button"
				aria-controls="userInfo" aria-expanded="true"
				aria-label="Collapse User Information">[-]</a>
			<span>Section B</span>
		</div>
		<fieldset id="userInfo">
			<legend>User Information</legend>

			<div class="textinput">
				<label for="uname">Name</label>
				<input id="uname" type="text" name="uname" />
			</div>

			<div class="radioinput" role="group" aria-labelledby="genderLabel">
				<span id="genderLabel" class="radiolabel">Gender</span>

				<input id="genm" type="radio" name="gender" value="M" />
				<label for="genm">Male</label>

				<input id="genf" type="radio" name="gender" value="F" />
				<label for="genf">Female</label>
			</div>
		</fieldset>

		<div class="buttoninput">
			<input type="submit" value="Test Register" />
		</div>
	</form>
</body>
</html>
